name: Markdown episode references

on:
  pull_request:
    paths:
      - ".github/workflows/markdown-episode-refs.yml"
      - "studies/**/README.md"
      - "studies/**/episodes/**"
      - "scripts/validate_markdown_episode_refs.py"
      - "tests/test_markdown_episode_refs.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/markdown-episode-refs.yml"
      - "studies/**/README.md"
      - "studies/**/episodes/**"
      - "scripts/validate_markdown_episode_refs.py"
      - "tests/test_markdown_episode_refs.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/validate_markdown_episode_refs.py
      - run: python -m unittest discover -s tests -p "test_markdown_episode_refs.py" -v
