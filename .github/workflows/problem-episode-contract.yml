name: Problem Episode contract

on:
  pull_request:
    paths:
      - ".github/workflows/problem-episode-contract.yml"
      - "fixtures/problem-episodes/**"
      - "schemas/problem-episode.schema.json"
      - "scripts/validate_problem_episodes.py"
      - "tests/test_problem_episode_contract.py"
      - "requirements-dev.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/problem-episode-contract.yml"
      - "fixtures/problem-episodes/**"
      - "schemas/problem-episode.schema.json"
      - "scripts/validate_problem_episodes.py"
      - "tests/test_problem_episode_contract.py"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate_problem_episodes.py
      - run: python -m unittest discover -s tests -v
